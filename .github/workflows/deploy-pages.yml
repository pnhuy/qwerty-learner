# Builds the app and publishes it with GitHub Pages (Settings → Pages → Source: "GitHub Actions").
# The site is served at https://<owner>.github.io/qwerty-learner/; REACT_APP_DEPLOY_ENV=pages sets that base path,
# so the repository must be named qwerty-learner.
name: Deploy to GitHub Pages
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  REACT_APP_DEPLOY_ENV: pages
  SITE_URL: https://${{ github.repository_owner }}.github.io/qwerty-learner/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.17.0
          cache: yarn
      - name: Install packages
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
